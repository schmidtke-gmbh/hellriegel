[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# Repo-Interna nicht ausliefern (Funktionen laufen weiter unter /.netlify/functions/)
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/index.html.tmp"
  to = "/404.html"
  status = 404
  force = true
