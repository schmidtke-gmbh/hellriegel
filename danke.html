<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vielen Dank · Hauke Hellriegel · Zahnarzt Essen-Werden</title>
<meta name="description" content="Ihre Nachricht ist bei uns eingegangen.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --c-gold:#C5A64A; --c-gold-d:#9a7e30; --c-gold-l:#e4ca7c;
    --c-anthrazit:#1B1F2A; --c-text:#3a3a3d; --c-muted:#6b6b6e;
    --c-hellgrau:#F2F4F6; --c-weiss:#FFFFFF; --c-salbei:#A8B88A;
    --c-border:rgba(27,31,42,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--c-hellgrau);color:var(--c-anthrazit);font-family:'Montserrat',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--c-weiss);border:1px solid var(--c-border);border-radius:20px;padding:56px 40px;max-width:560px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(27,31,42,.08);}
  .card .logo{max-width:220px;height:auto;margin:0 auto 32px;display:block;}
  .check{width:72px;height:72px;border-radius:50%;background:var(--c-gold);color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-bottom:24px;}
  .check svg{width:36px;height:36px;}
  h1{font-size:28px;font-weight:800;letter-spacing:-.4px;margin-bottom:12px;}
  p{color:var(--c-text);font-size:15px;margin-bottom:8px;}
  p.small{color:var(--c-muted);font-size:13px;margin-bottom:28px;}
  .btn{display:inline-block;background:var(--c-anthrazit);color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:14px 28px;border-radius:999px;transition:background .2s;}
  .btn:hover{background:var(--c-gold-d);}
  .tel{margin-top:22px;font-size:13px;color:var(--c-muted);}
  .tel a{color:var(--c-gold-d);font-weight:600;text-decoration:none;}

  /* Witwen ohne &nbsp; vermeiden, sonst entstehen unteilbare Wortpaare */
  h1,h2,h3{text-wrap:pretty;}
  h1,h2,h3,h4,p,li,.card-title,.card-desc,.v-num,.kicker{overflow-wrap:break-word;}
  @media (max-width:680px){
    .ueber-img .gold-disc{right:-10px;top:-10px;width:84px;height:84px;}
  }

  @media (max-width:1080px){
    /* Scroll-Kippanimation erzeugt auf schmalen Schirmen eine gedrehte Bounding-Box
       und damit horizontales Scrollen. Auf Mobil daher aus. */
    .implant-frame{transform:none!important;}
    .implant-pin,.therapien-teaser,.ueber,.hero,.einblicke,.anwendung{overflow-x:clip;}
  }

  @media (max-width:1080px){
    .u-tech-grid{grid-template-columns:minmax(0,1fr);}
    .u-tech-grid > *,.u-values-grid > *,.k-values-grid > *,.tech-grid > *{min-width:0;}
  }

  @media (max-width:1080px){
    /* Sicherheitsnetz: nie horizontal scrollbar. clip statt hidden,
       damit position:sticky (Header) weiter funktioniert. */
    html,body{overflow-x:clip;}
  }

  /* Mobile-Feinschliff: Logo, Hero-Collage, Trust-Leiste */
  @media (max-width:1080px){
    .nav-logo img{height:68px;}
    .nav-btn-sm{padding:11px 15px;gap:8px;letter-spacing:1px;}
  }
  @media (max-width:420px){
    .nav-logo img{height:60px;}
    .nav-btn-sm{font-size:10px;padding:10px 12px;gap:6px;}
    .nav-btn-sm .arrow{display:none;}
  }
  @media (max-width:680px){
    /* Hero: Collage aus Statue und OP-Foto funktioniert auf schmalen Schirmen nicht,
       daher nur die Videokarte, sauber über die volle Breite. */
    .hero{padding:32px 0 36px;}
    .hero-grid{display:block!important;}
    .hero-visual{min-height:0!important;height:auto!important;max-width:100%;margin:28px 0 0;display:block;}
    .hero-statue,.hero-second{display:none!important;}
    .hero-team{position:static!important;width:100%!important;height:auto!important;aspect-ratio:16/9;margin:0!important;}
    .hero-team img{width:100%;height:100%;object-fit:cover;}
    /* Trust-Leiste untereinander statt nebeneinander */
    .trust-bar > .container{flex-direction:column;align-items:flex-start;gap:22px;}
    .trust-bar h2{margin:0;}
    .trust-logos{flex-direction:row;flex-wrap:wrap;align-items:center;gap:14px 30px;width:100%;}
    .trust-bar .stat{margin:0;}
  }

  /* Überschriften: keine Brüche mitten im Wort, dafür kleinere Schrift auf schmalen Schirmen */
  h1,h2,h3{overflow-wrap:normal;word-break:normal;-webkit-hyphens:manual;hyphens:manual;}
  @media (max-width:460px){
    /* !important, weil Seitenregeln wie .k-hero h1 spezifischer sind */
    h1{font-size:clamp(20px,7.6vw,40px)!important;}
    h2{font-size:clamp(18px,6.4vw,28px)!important;}
    h3{font-size:clamp(15.5px,4.4vw,20px)!important;}
  }
  @media (max-width:1080px){
    /* .k-split.reverse ist spezifischer als .k-split und blieb sonst zweispaltig */
    .k-split.reverse{grid-template-columns:minmax(0,1fr);}
  }

  @media (max-width:980px){
    /* ID-Regel war spezifischer als die mobilen Klassenregeln */
    #kosten .k-values-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (max-width:680px){
    #kosten .k-values-grid{grid-template-columns:minmax(0,1fr);}
  }
</style>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>Vielen Dank!</h1>
    <p>Ihre Nachricht ist bei uns&nbsp;eingegangen.</p>
    <p class="small">Wir melden uns in der Regel innerhalb von 24–48 Stunden bei&nbsp;Ihnen.</p>
    <a href="index.html" class="btn">Zurück zur Startseite</a>
    <p class="tel">Dringend? Rufen Sie uns an: <a href="tel:+49201493126">0201 · 493&nbsp;126</a></p>
  </main>
</body>
</html>
